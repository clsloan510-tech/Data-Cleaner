[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaner"
version = "0.1.0"
description = "A data-centric AI laboratory for data quality, cleaning, validation, ML, and monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Carson Sloan"}]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
analysis = [
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
ml = [
    "xgboost>=2.0",
]
llm = [
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
